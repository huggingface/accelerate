name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@0f18554db6c17f5314928674ab7437754e6b43bb  # main
    with:
      commit_sha: ${{ github.sha }}
      package: accelerate
      python_version: "3.14"
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
