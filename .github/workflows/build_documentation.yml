name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@145b9d4f6ab65ad3af87c66773b2c43294e52446  # main
    with:
      commit_sha: ${{ github.sha }}
      package: accelerate
      python_version: "3.14"
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
