name: Trigger docker images and run tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  check-for-source:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Check if setup was changed
    outputs:
      changed: ${{ steps.was_changed.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          persist-credentials: false
          fetch-depth: 0

      - name: Was setup changed 
        id: was_changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          if git diff --name-only "$base" HEAD | grep -qE '(^|/)setup\.py$'; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
          
  build-docker-containers:
    permissions:
      contents: read
    needs: check-for-source
    if: (github.event_name == 'push') && (needs.check-for-source.outputs.changed == '1')
    uses: ./.github/workflows/build_docker_images.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  run-merge-tests:
    permissions: {}
    needs: build-docker-containers
    if: always()
    uses: ./.github/workflows/run_merge_tests.yml

  run-integration-tests:
    permissions: {}
    needs: build-docker-containers
    if: always()
    uses: ./.github/workflows/self_hosted_integration_tests.yml
