name: "\U0001F41B Bug Report"
description: Submit a bug report to help us improve Accelerate
body:
  - type: markdown
    attributes: 
      value: | 
        Thanks for taking the time to submit a bug report! 🐛 
        Please explain how you use Accelerate and include a minimal, runnable example that reproduces the problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem you encountered and the behavior you observed.
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: Please share your accelerate configuration with us. You can run the command `accelerate env` and copy-paste its outputs below
      render: Shell
      placeholder: accelerate version, OS, python version, numpy version, torch version, and accelerate's configuration
    validations:
      required: true
  
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        Describe what you are doing with Accelerate and how this problem affects your workflow.
        Link your project, model, or code if it is public.
    validations:
      required: true

  - type: textarea
    id: reproduction
    validations:
      required: true
    attributes:
      label: Reproduction
      description: |
        Please provide a code sample that reproduces the problem you ran into. It can be a Colab link or just a code snippet.
        If you have code snippets, error messages, stack traces please provide them here as well.
        Important! Use code tags to correctly format your code. See https://help.github.com/en/github/writing-on-github/creating-and-highlighting-code-blocks#syntax-highlighting
        Do not use screenshots, as they are hard to read and (more importantly) don't allow others to copy-and-paste your code.

      placeholder: |
        Steps to reproduce the behavior:
          
          1.
          2.
          3.

  - type: textarea
    id: expected-behavior
    validations:
      required: true
    attributes:
      label: Expected behavior
      description: "A clear and concise description of what you would expect to happen."
